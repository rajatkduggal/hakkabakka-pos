<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HakkaBakka POS</title><style>
:root{--wine:#521719;--gold:#d6a64c;--cream:#f7f0e6;--paper:#fffaf3;--ink:#2b211d}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px system-ui}.top{background:var(--wine);color:white;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}.top b{font:700 24px Georgia}.wrap{max-width:1200px;margin:auto;padding:18px}.panel{background:var(--paper);border:1px solid #e4d6c6;border-radius:16px;padding:16px;margin-bottom:16px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,select,button{font:inherit;padding:11px;border:1px solid #d6c6b6;border-radius:9px}button{background:var(--wine);color:white;border:0;font-weight:700;cursor:pointer}button.secondary{background:#eee2d2;color:var(--wine)}.tables{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.table{padding:15px 5px;text-align:center;border-radius:10px;background:#e7f1e5;color:#1e6636;border:1px solid #c5dfc0}.table.busy{background:#f6e1df;color:#8c2929;border-color:#e9b9b4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.item{background:#f2e7d9;color:var(--wine);text-align:left}.orders{display:grid;gap:8px}.order{padding:12px;background:#f4eadf;border-radius:10px}.muted{color:#78685d;font-size:13px}.hidden{display:none}.order-items{font-size:13px;color:#65564d;margin:6px 0}.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.report-tile{background:#f2e7d9;border-radius:10px;padding:12px}.report-tile b{display:block;font-size:20px;color:var(--wine)}#kot{display:none}@media(max-width:760px){.grid{grid-template-columns:1fr}.tables{grid-template-columns:repeat(4,1fr)}.report-grid{grid-template-columns:1fr 1fr}}@media print{body *{visibility:hidden}#kot,#kot *{visibility:visible}#kot{display:block;position:absolute;left:0;top:0;width:72mm;padding:3mm;font:12px monospace;color:#000}}
</style></head><body><header class="top"><b>HakkaBakka POS</b><span>20 Tables · Kitchen Counter</span></header><main class="wrap">
<section id="login" class="panel"><h2>Staff Login</h2><p class="muted">Uses the existing HakkaBakka Admin password/session.</p><div class="row"><input id="password" type="password" placeholder="Admin password" autocomplete="current-password"><button onclick="login()">Login</button></div><p id="loginMsg" class="muted"></p></section>
<section id="app" class="hidden"><div class="row panel"><b>POS Counter</b><span id="who" class="muted">Authenticated admin session</span><button class="secondary" onclick="refresh()">Refresh</button><button class="secondary" onclick="logout()">Logout</button></div>
<div class="panel"><h3>Table status</h3><div id="tables" class="tables"></div></div>
<div class="grid"><section class="panel"><h3>New order</h3><div class="row"><select id="type" onchange="toggleTable()"><option value="DINE_IN">Dine-in</option><option value="TAKEAWAY">Takeaway</option><option value="DELIVERY">Delivery</option></select><select id="table"></select></div><div class="row" style="margin:10px 0"><input id="customer" placeholder="Customer name" value="Walk-in"><input id="mobile" placeholder="Mobile"></div><h4>Menu quick-add</h4><div id="menu" class="menu"></div><h4>Cart</h4><div id="cart"></div><div class="row"><select id="pay"><option>CASH</option><option>UPI</option><option>CARD</option></select><button onclick="saveOrder()">Save order & send KOT</button></div><p id="msg" class="muted"></p></section>
<section class="panel"><h3>Kitchen / Orders</h3><div id="orders" class="orders"></div></section></div><section class="panel"><h3>Daily sales</h3><div id="report">Load report</div><button class="secondary" onclick="report()">Refresh report</button></section></section></main><div id="kot"></div>
<script>
const API="https://hakkabakka-pos-preview-api.mail-marvelgroup.workers.dev";
let cart=[];let adminToken="";
async function call(path,opts={}){const r=await fetch(API+path,{...opts,credentials:"include",headers:{"Content-Type":"application/json",...(adminToken?{Authorization:"Bearer "+adminToken}:{}),...(opts.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed ("+r.status+")");return d}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function login(){const m=document.getElementById("loginMsg");m.textContent="Checking…";try{const r=await fetch("https://hakkabakka-admin-api.mail-marvelgroup.workers.dev/api/login",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:document.getElementById("password").value})});const d=await r.json();if(!r.ok||!d.ok||!d.sessionToken)throw Error(d.error||"Login failed: session token missing");adminToken=d.sessionToken;document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");await refresh()}catch(e){m.textContent=e.message}}
async function logout(){try{await fetch("https://hakkabakka-admin-api.mail-marvelgroup.workers.dev/api/logout",{method:"POST",credentials:"include"})}catch{}adminToken="";location.reload()}
function toggleTable(){document.getElementById("table").disabled=document.getElementById("type").value!=="DINE_IN"}
function add(n,p){let x=cart.find(x=>x.name===n);if(x)x.qty++;else cart.push({name:n,price:p,qty:1});drawCart()}
function drawCart(){document.getElementById("cart").innerHTML=cart.map((x,i)=>'<div class="row">'+esc(x.name)+' × '+x.qty+' — ₹'+x.price*x.qty+' <button class="secondary" onclick="cart.splice('+i+',1);drawCart()">Remove</button></div>').join("")||"Cart empty"}
async function refresh(){try{const [t,o,m]=await Promise.all([call("/api/tables"),call("/api/orders"),call("/api/menu")]);document.getElementById("menu").innerHTML=(m.items||[]).map(x=>'<button class="item" onclick="add('+JSON.stringify(x.name)+','+Number(x.price)+')">'+esc(x.name)+' · ₹'+Number(x.price)+'</button>').join("")||"No published menu items";document.getElementById("tables").innerHTML=t.tables.map(x=>'<div class="table '+(x.status==="OCCUPIED"?"busy":"")+'">Table '+x.table_no+'<br>'+esc(x.status)+'</div>').join("");document.getElementById("table").innerHTML=t.tables.map(x=>'<option value="'+x.table_no+'">Table '+x.table_no+' — '+esc(x.status)+'</option>').join("");document.getElementById("orders").innerHTML=o.orders.map(x=>{const d=x.details||{};const items=Array.isArray(d.items)?d.items:[];const itemText=items.map(i=>(Number(i.qty)||1)+' × '+esc(i.name||i.item_name||"Item")).join(" · ");return '<div class="order"><b>'+esc(x.order_number)+'</b> · ₹'+Number(x.total_amount||0)+'<br><b>'+esc(x.source||"ORDER")+'</b> · '+esc(x.customer_name||d.customer_name||"Walk-in")+' · '+esc(x.mobile||d.mobile||"")+'<br>'+esc(x.order_status)+' / '+esc(x.payment_status)+'<div class="order-items">'+(itemText||"Item details unavailable")+'</div><button onclick="status('+JSON.stringify(x.order_number)+',\'PREPARING\')">Preparing</button> <button onclick="status('+JSON.stringify(x.order_number)+',\'READY\')">Ready</button> <button onclick="status('+JSON.stringify(x.order_number)+',\'COMPLETED\')">Complete</button> <button class="secondary" onclick="payment('+JSON.stringify(x.order_number)+')">Confirm payment</button> <button class="secondary" onclick="printExistingKot('+JSON.stringify(x.order_number)+')">Reprint KOT</button></div>'}).join("")||"No orders";await report()}catch(e){document.getElementById("msg").textContent=e.message}}
async function saveOrder(){if(!cart.length)return alert("Add menu items first");const type=document.getElementById("type").value;const body={order_type:type,table_no:Number(document.getElementById("table").value),customer_name:document.getElementById("customer").value,mobile:document.getElementById("mobile").value,payment_method:document.getElementById("pay").value,items:cart};try{const x=await call("/api/orders",{method:"POST",body:JSON.stringify(body)});document.getElementById("msg").textContent="Saved "+x.order_number+" · payment pending";printKot(x.order_number,body);cart=[];drawCart();await refresh()}catch(e){document.getElementById("msg").textContent=e.message}}
async function status(n,s){try{await call("/api/orders/"+encodeURIComponent(n)+"/status",{method:"PATCH",body:JSON.stringify({status:s})});await refresh()}catch(e){alert(e.message)}}
async function payment(n){if(!confirm("Confirm that payment was actually received for "+n+"?"))return;try{await call("/api/orders/"+encodeURIComponent(n)+"/payment",{method:"PATCH",body:JSON.stringify({payment_status:"PAID"})});await refresh()}catch(e){alert(e.message)}}
async function report(){try{const x=await call("/api/reports/daily");document.getElementById("report").innerHTML='<div class="report-grid"><div class="report-tile">Total orders<b>'+Number(x.orders||0)+'</b></div><div class="report-tile">Gross sales<b>₹'+Number(x.gross_sales||0).toFixed(2)+'</b></div><div class="report-tile">POS / Online<b>'+Number(x.pos_orders||0)+' / '+Number(x.online_orders||0)+'</b></div></div><div class="muted">'+esc(x.date||"")+' · POS ₹'+Number(x.pos_sales||0).toFixed(2)+' · Online ₹'+Number(x.online_sales||0).toFixed(2)+'</div>'}catch(e){document.getElementById("report").textContent=e.message}}
function printKot(n,b){document.getElementById("kot").innerHTML='<h2>HAKKABAKKA</h2><b>KITCHEN ORDER TICKET</b><hr>Order: '+esc(n)+'<br>Type: '+esc(b.order_type)+'<br>Table: '+(b.order_type==="DINE_IN"?esc(b.table_no):"—")+'<hr>'+b.items.map(x=>Number(x.qty||1)+' × '+esc(x.name)).join("<br>")+'<hr>Printed '+new Date().toLocaleString();window.print()}
function printExistingKot(n){const card=[...document.querySelectorAll(".order")].find(el=>el.innerText.includes(n));if(!card)return alert("Order not found in current list. Refresh first.");const all=window.__hbOrders||[];const x=all.find(o=>o.order_number===n);if(!x)return alert("Order details are unavailable for KOT reprint.");const d=x.details||{},items=Array.isArray(d.items)?d.items:[];if(!items.length)return alert("No item details are stored for this order.");printKot(n,{order_type:d.order_type||x.source||"ONLINE",table_no:d.table_no,items})}
document.getElementById("menu").innerHTML="Login to load published menu";for(let i=1;i<=20;i++)document.getElementById("table").add(new Option("Table "+i,i));toggleTable();drawCart();
</script></body></html>
