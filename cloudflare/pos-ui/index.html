<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HakkaBakka POS</title><style>
:root{--wine:#521719;--gold:#d6a64c;--cream:#f7f0e6;--paper:#fffaf3;--ink:#2b211d}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px system-ui}.top{background:var(--wine);color:white;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}.top b{font:700 24px Georgia}.wrap{max-width:1200px;margin:auto;padding:18px}.panel{background:var(--paper);border:1px solid #e4d6c6;border-radius:16px;padding:16px;margin-bottom:16px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,select,button{font:inherit;padding:11px;border:1px solid #d6c6b6;border-radius:9px}button{background:var(--wine);color:white;border:0;font-weight:700;cursor:pointer}button.secondary{background:#eee2d2;color:var(--wine)}.tables{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.table{padding:15px 5px;text-align:center;border-radius:10px;background:#e7f1e5;color:#1e6636;border:1px solid #c5dfc0}.table.busy{background:#f6e1df;color:#8c2929;border-color:#e9b9b4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.item{background:#f2e7d9;color:var(--wine);text-align:left}.orders{display:grid;gap:8px}.order{padding:12px;background:#f4eadf;border-radius:10px}.muted{color:#78685d;font-size:13px}.hidden{display:none}.notice{padding:10px;border-radius:8px;background:#f5e7c9;margin:10px 0}#kot{display:none}@media(max-width:760px){.grid{grid-template-columns:1fr}.tables{grid-template-columns:repeat(4,1fr)}}@media print{body *{visibility:hidden}#kot,#kot *{visibility:visible}#kot{display:block;position:absolute;left:0;top:0;width:72mm;padding:3mm;font:12px monospace;color:#000}.no-print{display:none}}
</style></head><body><header class="top"><b>HakkaBakka POS</b><span>20 Tables · Kitchen Counter</span></header><main class="wrap">
<section id="login" class="panel"><h2>Staff Login</h2><p class="muted">Uses the existing HakkaBakka Admin password/session.</p><div class="row"><input id="password" type="password" placeholder="Admin password" autocomplete="current-password"><button onclick="login()">Login</button></div><p id="loginMsg" class="muted"></p></section>
<section id="app" class="hidden"><div class="row panel"><b>POS Counter</b><span id="who" class="muted">Authenticated admin session</span><button class="secondary" onclick="refresh()">Refresh</button><button class="secondary" onclick="logout()">Logout</button></div>
<div class="panel"><h3>Table status</h3><div id="tables" class="tables"></div></div>
<div class="grid"><section class="panel"><h3>New order</h3><div class="row"><select id="type" onchange="toggleTable()"><option value="DINE_IN">Dine-in</option><option value="TAKEAWAY">Takeaway</option><option value="DELIVERY">Delivery</option></select><select id="table"></select></div><div class="row" style="margin:10px 0"><input id="customer" placeholder="Customer name" value="Walk-in"><input id="mobile" placeholder="Mobile"></div><h4>Menu quick-add</h4><div id="menu" class="menu"></div><h4>Cart</h4><div id="cart"></div><div class="row"><select id="pay"><option>CASH</option><option>UPI</option><option>CARD</option></select><button onclick="saveOrder()">Save order & send KOT</button></div><p id="msg" class="muted"></p></section>
<section class="panel"><h3>Kitchen / Orders</h3><div id="orders" class="orders"></div></section></div><section class="panel"><h3>Daily sales</h3><div id="report">Load report</div><button class="secondary" onclick="report()">Refresh report</button></section></section></main><div id="kot"></div>
<script>
const API="https://hakkabakka-pos-preview-api.mail-marvelgroup.workers.dev";
const menu=[["Dal Fry",160],["Dal Makhani",210],["Paneer Butter Masala",240],["Butter Chicken",290],["Chana Masala",170],["Tandoori Roti",25],["Butter Naan",55],["White Sauce Pasta",220],["Cold Coffee",120],["Sweet Lassi",70]];
let cart=[];
async function call(path,opts={}){const r=await fetch(API+path,{...opts,credentials:"include",headers:{"Content-Type":"application/json",...(opts.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed ("+r.status+")");return d}
async function login(){const m=document.getElementById("loginMsg");m.textContent="Checking…";try{const r=await fetch("https://hakkabakka-admin-api.mail-marvelgroup.workers.dev/api/login",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:document.getElementById("password").value})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"Login failed");document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden");await refresh()}catch(e){m.textContent=e.message}}
async function logout(){try{await fetch("https://hakkabakka-admin-api.mail-marvelgroup.workers.dev/api/logout",{method:"POST",credentials:"include"})}catch{}location.reload()}
function toggleTable(){document.getElementById("table").disabled=document.getElementById("type").value!=="DINE_IN"}
function add(n,p){let x=cart.find(x=>x.name===n);if(x)x.qty++;else cart.push({name:n,price:p,qty:1});drawCart()}
function drawCart(){document.getElementById("cart").innerHTML=cart.map((x,i)=>'<div class="row">'+x.name+' × '+x.qty+' — ₹'+x.price*x.qty+' <button class="secondary" onclick="cart.splice('+i+',1);drawCart()">Remove</button></div>').join("")||"Cart empty"}
async function refresh(){try{const [t,o]=await Promise.all([call("/api/tables"),call("/api/orders")]);document.getElementById("tables").innerHTML=t.tables.map(x=>'<div class="table '+(x.status==="OCCUPIED"?"busy":"")+'">Table '+x.table_no+'<br>'+x.status+'</div>').join("");document.getElementById("table").innerHTML=t.tables.map(x=>'<option value="'+x.table_no+'">Table '+x.table_no+' — '+x.status+'</option>').join("");document.getElementById("orders").innerHTML=o.orders.map(x=>'<div class="order"><b>'+x.order_number+'</b> · ₹'+x.total_amount+'<br>'+x.order_status+' / '+x.payment_status+'<br><button onclick="status(\''+x.order_number+'\',\'PREPARING\')">Preparing</button> <button onclick="status(\''+x.order_number+'\',\'READY\')">Ready</button> <button onclick="status(\''+x.order_number+'\',\'COMPLETED\')">Complete</button> <button class="secondary" onclick="payment(\''+x.order_number+'\')">Confirm payment</button></div>').join("")||"No orders";}catch(e){document.getElementById("msg").textContent=e.message}}
async function saveOrder(){if(!cart.length)return alert("Add menu items first");const type=document.getElementById("type").value;const body={order_type:type,table_no:Number(document.getElementById("table").value),customer_name:document.getElementById("customer").value,mobile:document.getElementById("mobile").value,payment_method:document.getElementById("pay").value,items:cart};try{const x=await call("/api/orders",{method:"POST",body:JSON.stringify(body)});document.getElementById("msg").textContent="Saved "+x.order_number+" · payment pending";printKot(x.order_number,body);cart=[];drawCart();await refresh()}catch(e){document.getElementById("msg").textContent=e.message}}
async function status(n,s){try{await call("/api/orders/"+encodeURIComponent(n)+"/status",{method:"PATCH",body:JSON.stringify({status:s})});await refresh()}catch(e){alert(e.message)}}
async function payment(n){if(!confirm("Confirm that payment was actually received for "+n+"?"))return;try{await call("/api/orders/"+encodeURIComponent(n)+"/payment",{method:"PATCH",body:JSON.stringify({payment_status:"PAID"})});await refresh()}catch(e){alert(e.message)}}
async function report(){try{const x=await call("/api/reports/daily");document.getElementById("report").textContent=x.orders+" orders · ₹"+x.gross_sales+" gross sales"}catch(e){document.getElementById("report").textContent=e.message}}
function printKot(n,b){const total=cart.reduce((s,x)=>s+x.price*x.qty,0);document.getElementById("kot").innerHTML='<h2>HAKKABAKKA</h2><b>KITCHEN ORDER TICKET</b><hr>Order: '+n+'<br>Type: '+b.order_type+'<br>Table: '+(b.order_type==="DINE_IN"?b.table_no:"—")+'<hr>'+b.items.map(x=>x.qty+" × "+x.name).join("<br>")+'<hr>Printed '+new Date().toLocaleString();window.print()}
document.getElementById("menu").innerHTML=menu.map(x=>'<button class="item" onclick="add('+JSON.stringify(x[0])+','+x[1]+')">'+x[0]+' · ₹'+x[1]+'</button>').join("");for(let i=1;i<=20;i++)document.getElementById("table").add(new Option("Table "+i,i));toggleTable();drawCart();
</script></body></html>
