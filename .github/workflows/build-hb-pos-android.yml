name: Build HakkaBakka POS Android
on:
  push:
    branches: [native-live-updates]
    paths:
      - "android-live-updates/**"
      - ".github/workflows/build-hb-pos-android.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-live-updates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Configure Firebase for Android build
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$FIREBASE_GOOGLE_SERVICES_JSON" ]; then
            echo "Missing GitHub Actions secret FIREBASE_GOOGLE_SERVICES_JSON."
            exit 1
          fi
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > app/google-services.json
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hakkabakka-pos-debug-apk
          path: android-live-updates/app/build/outputs/apk/debug/app-debug.apk
